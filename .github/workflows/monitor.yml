name: MSTR Premium Monitor

on:
  schedule:
    # 美股工作日盘中每2小时检测；错峰至每小时第33分（避开整点、半点、一刻钟高峰）
    # 北京时间 22:33（例行）, 00:33, 02:33, 04:33
    - cron: '33 14,16,18,20 * * 1-5'
    # 备用兜底：22:50（北京），若22:33例行报告漏跑则补发
    - cron: '50 14 * * 1-5'
  workflow_dispatch:
    inputs:
      mark_only:
        description: '仅标记今日例行已发（不发邮件，用于已手动补发后防止重复）'
        type: boolean
        default: false

env:
  TZ: Asia/Shanghai

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache state
        uses: actions/cache@v4
        with:
          path: .mstr_last_state.json
          key: mstr-state-${{ github.run_id }}
          restore-keys: |
            mstr-state-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run monitor
        env:
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_ENABLED: 'true'
          MARK_ONLY: ${{ github.event.inputs.mark_only || 'false' }}
        run: |
          python mstr_monitor.py
