name: MSTR Premium Monitor

on:
  schedule:
    # 美股工作日盘中每2小时检测（北京时间 22:30, 00:30, 02:30, 04:30）
    - cron: '30 14,16,18,20 * * 1-5'
    # 备用：22:50，确保22:30例行报告漏跑时补发
    - cron: '50 14 * * 1-5'
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

      - name: Cache state
        uses: actions/cache@v4
        with:
          path: .mstr_last_state.json
          key: mstr-state-${{ github.run_id }}
          restore-keys: |
            mstr-state-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run monitor
        env:
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_ENABLED: 'true'
        run: |
          python mstr_monitor.py
