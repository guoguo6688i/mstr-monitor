name: run-backtest
on:
  workflow_dispatch:
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        run: pip install requests numpy
      - name: Run mNAV backtest
        run: python3 backtest.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: |
            mnav_daily.csv
            nav_curves.csv
            trades.csv
            performance.json
